spring.application.name=senetontine-api

# --- PostgreSQL ---
# Cree la base localement avant de lancer l'appli: `createdb senetontine` (ou via pgAdmin)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/senetontine}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

# --- JPA / Hibernate ---
# validate (et non plus update) : Hibernate verifie au demarrage que le schema correspond aux
# entites, mais ne le modifie plus jamais tout seul. Toute evolution de schema passe desormais
# par un script Flyway versionne (src/main/resources/db/migration) - voir la config Flyway
# ci-dessous. Evite les surprises du type colonne NOT NULL ajoutee sur une table deja peuplee.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Flyway ---
# baseline-on-migrate + baseline-version=1 : la base existe deja avec des tables (creees
# jusqu'ici par ddl-auto=update). Au premier demarrage, Flyway "adopte" cet etat existant comme
# version 1 sans rejouer V1__baseline.sql (qui documente juste l'etat de depart), puis applique
# uniquement les migrations suivantes (V2, V3...). Toute nouvelle evolution de schema doit
# desormais etre un nouveau fichier db/migration/V{n}__description.sql, jamais une modification
# manuelle de la base ou un retour a ddl-auto=update.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

server.port=${PORT:8080}

# Valeurs locales (mot de passe de ta base PostgreSQL) : fichier local.properties a la racine,
# exclu de Git. En production, tout passe par les variables d'environnement du serveur.
spring.config.import=optional:file:./local.properties

# Origines web autorisees a appeler l'API (CORS). En production : l'adresse de l'app,
# ex. https://senetontine.com (plusieurs valeurs separees par des virgules).
app.cors-origins=${CORS_ORIGINS:*}

# Petite instance gratuite (512 Mo) : pool de connexions reduit.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}


# --- Paiements createur (NabooPay) ---
# Prix d'une creation (a partir de la 2e tontine) ou d'un renouvellement, en FCFA.
billing.tontine-price=2500
# Adresse publique de l'app web (PWA) ou NabooPay renvoie l'utilisateur apres paiement.
app.public-url=${APP_PUBLIC_URL:http://localhost:8081}
# Cles NabooPay (tableau de bord NabooPay > Parametres > Integration). JAMAIS dans le code :
# uniquement en variables d'environnement sur le serveur.
naboopay.api-key=${NABOOPAY_API_KEY:}
naboopay.webhook-secret=${NABOOPAY_WEBHOOK_SECRET:}

# Sonde de sante publique : n'expose QUE l'etat UP/DOWN, aucun detail interne.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Telephones promus ADMIN au demarrage (virgules)
app.admin-phones=${ADMIN_PHONES:}
# Adresse secrete de l espace admin (12 a 64 caracteres). Vide = non cache (dev local)
app.admin-path=${ADMIN_PATH:}
