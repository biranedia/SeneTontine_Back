spring.datasource.url=jdbc:h2:mem:senetontine-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# Les tests recreent une base H2 vierge a chaque run (create-drop) : pas besoin de Flyway ici,
# et ca evite de dependre du dialecte Postgres du plugin flyway-database-postgresql sur H2.
spring.flyway.enabled=false
payment.simulation=true
platform.fee-rate=0.015
