# Déploiement Render (offre gratuite). Les valeurs "sync: false" se saisissent dans le
# tableau de bord Render, jamais dans ce fichier.
services:
  - type: web
    name: senetontine-api
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /actuator/health
    autoDeploy: true
    domains:
      - api.senetontine.com
    envVars:
      - key: DATABASE_URL        # Neon, projet senetontine (Francfort), connexion directe
        value: jdbc:postgresql://ep-rough-hat-bam5cslo.c-8.eu-central-1.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_USERNAME
        value: neondb_owner
      - key: DATABASE_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://senetontine.com,https://www.senetontine.com
      - key: APP_PUBLIC_URL
        value: https://senetontine.com
      - key: DB_POOL_SIZE        # Neon gratuit : peu de connexions
        value: "5"
      - key: ADMIN_PATH          # adresse secrète de l'espace admin (12-64 caractères)
        sync: false
      - key: ADMIN_PHONES        # ton numéro, tel que saisi à l'inscription
        sync: false
      - key: NABOOPAY_API_KEY
        sync: false
      - key: NABOOPAY_WEBHOOK_SECRET
        sync: false
